# Gripper Session Configuration
# ==============================
# Configure this file before each demo collection session.
# Maps each gripper to an object type from grasp_objects.yaml.
#
# Usage:
#   1. Edit this file to set the object each gripper will grasp
#   2. Run the controller: python dual_ur5e_controller_standalone.py
#   3. The controller will configure force/speed based on object type
#
# You can also override via CLI:
#   python dual_ur5e_controller_standalone.py --left-object apple --right-object screwdriver

left_gripper:
  # Object name from grasp_objects.yaml
  object: apple

right_gripper:
  # Object name from grasp_objects.yaml
  object: screwdriver
