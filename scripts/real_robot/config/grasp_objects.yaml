# Grasp Objects Configuration
# ===========================
# Defines grip parameters for different object types.
# Used by dual_ur5e_controller_standalone.py for adaptive gripping.
#
# Parameters:
#   current_threshold: Amps - stop closing when current exceeds this value
#                      Set to null for full grip (no current limit)
#   force: 0-255 Robotiq force setting (higher = stronger grip)
#   speed: 0-255 closing speed (optional, default 100)
#
# Current reference (Robotiq 2F-140):
#   - Idle/no load: ~0.01A
#   - Light contact: ~0.02A
#   - Medium grip: ~0.03-0.04A
#   - Strong grip: ~0.05A+

objects:
  # =========================================================================
  # DELICATE ITEMS - Low force, strict current threshold
  # =========================================================================
  apple:
    current_threshold: 0.022
    force: 30
    speed: 50

  strawberry:
    current_threshold: 0.018
    force: 20
    speed: 30

  egg:
    current_threshold: 0.015
    force: 15
    speed: 25

  bread:
    current_threshold: 0.020
    force: 25
    speed: 40

  tomato:
    current_threshold: 0.020
    force: 25
    speed: 40

  # =========================================================================
  # MEDIUM ITEMS - Moderate force, moderate current threshold
  # =========================================================================
  water_bottle:
    current_threshold: 0.032
    force: 120
    speed: 100

  can:
    current_threshold: 0.035
    force: 130
    speed: 100

  plastic_cup:
    current_threshold: 0.028
    force: 80
    speed: 80

  orange:
    current_threshold: 0.030
    force: 100
    speed: 80

  banana:
    current_threshold: 0.025
    force: 60
    speed: 60

  # =========================================================================
  # ROBUST ITEMS - High force, no current threshold (full grip)
  # =========================================================================
  screwdriver:
    current_threshold: null
    force: 220
    speed: 150

  hammer:
    current_threshold: null
    force: 255
    speed: 200

  wrench:
    current_threshold: null
    force: 240
    speed: 180

  pliers:
    current_threshold: null
    force: 230
    speed: 160

  metal_part:
    current_threshold: null
    force: 255
    speed: 200

  wooden_block:
    current_threshold: null
    force: 200
    speed: 150

# Default fallback parameters - used when object not found
default:
  current_threshold: null
  force: 150
  speed: 100
